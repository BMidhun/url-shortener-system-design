services:
  # Redis config
  redis:
    image: redis:alpine
    container_name: redis-cache
    ports:
      - "6379:6379"
    networks:
      - app-network

  # Express app
  express-app:
    build: .
    command: npm run start
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DB_USER=postgres
      - DB_HOST=host.docker.internal
      - DB_NAME=urlShortDB
      - DB_PASSWORD=password
      - DB_PORT=5432
      - REDIS_PORT=6379
      - REDIS_HOST=redis
    depends_on:
      - redis
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  #nginx-server

  # Nginx now builds from your frontend directory and runs itself!
  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nginx-lb
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/localhost+2-key.pem:/etc/nginx/certs/localhost-key.pem:ro
      - ./certs/localhost+2.pem:/etc/nginx/certs/localhost.pem:ro
    depends_on:
      - express-app
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
