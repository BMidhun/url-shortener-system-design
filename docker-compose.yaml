services:
  # Redis config
  redis:
    image: redis:alpine
    container_name: redis-cache
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - app-network

  # Express app
  express-app:
    build: .
    command: npm run start
    environment:
      - PORT=${PORT}
      - NODE_ENV=${NODE_ENV}
      - DB_USER=${DB_USER}
      - DB_HOST=host.docker.internal
      - DB_NAME=${DB_NAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=${DB_PORT}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_HOST=redis
      - MAX_DB_POOL_CONNECTIONS=${MAX_DB_POOL_CONNECTIONS}
      - IDLE_DB_TIMEOUT=${IDLE_DB_TIMEOUT}
      - DB_CONNECTION_TIMEOUT=${DB_CONNECTION_TIMEOUT}
    depends_on:
      - redis
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  #nginx-server

  # Nginx now builds from your frontend directory and runs itself!
  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nginx-lb
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs/localhost+2-key.pem:/etc/nginx/certs/localhost-key.pem:ro
      - ./certs/localhost+2.pem:/etc/nginx/certs/localhost.pem:ro
    depends_on:
      - express-app
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
